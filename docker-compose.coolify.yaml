services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.25.1
    restart: unless-stopped
    environment:
      MAIN_URL: ${POSTIZ_URL:?}
      FRONTEND_URL: ${POSTIZ_URL:?}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_URL:?}/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET:?}
      DATABASE_URL: postgresql://postiz-user:${POSTIZ_DB_PASSWORD:?}@postiz-postgres:5432/postiz-db-local
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'true'
      RUN_CRON: 'true'
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      X_API_KEY: ''
      X_API_SECRET: ''
      LINKEDIN_CLIENT_ID: ''
      LINKEDIN_CLIENT_SECRET: ''
      REDDIT_CLIENT_ID: ''
      REDDIT_CLIENT_SECRET: ''
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      BEEHIIVE_API_KEY: ''
      BEEHIIVE_PUBLICATION_ID: ''
      THREADS_APP_ID: ''
      THREADS_APP_SECRET: ''
      FACEBOOK_APP_ID: ''
      FACEBOOK_APP_SECRET: ''
      YOUTUBE_CLIENT_ID: ''
      YOUTUBE_CLIENT_SECRET: ''
      TIKTOK_CLIENT_ID: ''
      TIKTOK_CLIENT_SECRET: ''
      PINTEREST_CLIENT_ID: ''
      PINTEREST_CLIENT_SECRET: ''
      DRIBBBLE_CLIENT_ID: ''
      DRIBBBLE_CLIENT_SECRET: ''
      DISCORD_CLIENT_ID: ''
      DISCORD_CLIENT_SECRET: ''
      DISCORD_BOT_TOKEN_ID: ''
      SLACK_ID: ''
      SLACK_SECRET: ''
      SLACK_SIGNING_SECRET: ''
      MASTODON_URL: https://mastodon.social
      MASTODON_CLIENT_ID: ''
      MASTODON_CLIENT_SECRET: ''
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXT_PUBLIC_DISCORD_SUPPORT: ''
      NEXT_PUBLIC_POLOTNO: ''
      API_LIMIT: 30
      FEE_AMOUNT: 0.05
      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_SIGNING_KEY: ''
      STRIPE_SIGNING_KEY_CONNECT: ''
      NX_ADD_PLUGINS: false
    volumes:
    - postiz-config:/config/
    - postiz-uploads:/uploads/
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    mem_limit: 3g
    expose:
    - '5000'
  postiz-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD:?}
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
    - postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
  postiz-redis:
    image: redis:7.2
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
    - postiz-redis-data:/data
    mem_limit: 256m
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
    - cluster.routing.allocation.disk.threshold_enabled=true
    - cluster.routing.allocation.disk.watermark.low=512mb
    - cluster.routing.allocation.disk.watermark.high=256mb
    - cluster.routing.allocation.disk.watermark.flood_stage=128mb
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms256m -Xmx256m
    - xpack.security.enabled=false
    expose:
    - 9200
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
        || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
    - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 768m
  temporal-postgresql:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?}
      POSTGRES_USER: temporal
    expose:
    - 5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U temporal
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
    - temporal-postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
  temporal:
    restart: unless-stopped
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
    - DB=postgres12
    - DB_PORT=5432
    - POSTGRES_USER=temporal
    - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:?}
    - POSTGRES_SEEDS=temporal-postgresql
    - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    - ENABLE_ES=true
    - ES_SEEDS=temporal-elasticsearch
    - ES_VERSION=v7
    - TEMPORAL_NAMESPACE=default
    healthcheck:
      test:
      - CMD
      - temporal
      - operator
      - cluster
      - health
      - --address
      - temporal:7233
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    configs:
    - source: temporal-dynamic
      target: /etc/temporal/config/dynamicconfig/development-sql.yaml
  codex-bridge:
    build:
      context: ./services/codex-bridge
    environment:
      CODEX_BRIDGE_TOKEN: ${CODEX_BRIDGE_TOKEN:?}
      CODEX_HOME: /home/node/.codex
    volumes:
    - codex-auth:/home/node/.codex
    tmpfs:
    - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres-volume:
    external: false
  postiz-redis-data:
    external: false
  postiz-config:
    external: false
  postiz-uploads:
    external: false
  temporal-postgres-data:
    external: false
  temporal-elasticsearch-data:
    external: false
  codex-auth: {}
configs:
  temporal-dynamic:
    content: "limit.maxIDLength:\n  - value: 255\n    constraints: {}\n"
